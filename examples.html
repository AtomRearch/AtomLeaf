<header><a class="wordmark" href="index.html"><svg aria-hidden="true"><use href="#leaf"/></svg>AtomLeaf</a><nav aria-label="产品导航"><a href="index.html">首页</a><a href="examples.html" aria-current="page">案例</a><a href="guide.html">指南</a><a href="about.html">理念</a></nav></header><main><section class="page-intro"><div class="chapter-label">MANY WAYS TO KEEP A DAY</div><h1>你的材料，<br>有自己的样子。</h1><p>文学、随笔、生活、艺术、旅行与实验。先看看原始片段，再展开整理候选：重点是自己的理解如何留下，而不是让模型多写一段话。</p><p class="source">以下均为原创演示。整理候选是预写示例，未连接模型，也不会保存你的资料。</p></section><div class="case-grid" id="allCases"></div><a class="pill-link" href="guide.html">用自己的第一份材料试试 →</a></main><footer><span>AtomLeaf · 留一点好奇。</span><span>产品预览 · 不在此网页发送材料</span></footer><script>const leafCases=[
 {id:'literature',name:'文学阅读',en:'READING',title:'故事停下来的地方',kind:'原创短篇阅读笔记',source:'《雨后散步》· 原创演示片段',excerpt:'雨停以后，他没有立刻回家。沿着河堤多走的一段路，成了这一天唯一没有被安排的时间。',thought:'最后一句让我停了一下。打动我的，或许不是散步，而是重新拥有一点自己的时间。',question:'如果删掉最后一句，人物的心境会发生什么变化？',tags:['时间','自由','叙事'],organize:[['摘录','保留“没有被安排的时间”，并和原片段关联。','原文'],['我的理解','读者联想到对时间的自主选择，作为个人解读保留。','读后感'],['可追问','这份自在是由哪些词句营造的？先回到片段，再展开讨论。','问题']],ask:[['问题','这段文字为什么让人觉得松了一口气？','围绕原片段'],['讨论方向','可以比较“没有立刻回家”和“没有被安排”的作用；“时间的自主选择”是读者的解读，不能当成唯一答案。','阅读角度'],['保留开放性','你也可能读出孤独或犹豫。把不同理解并列，回到措辞寻找依据。','待讨论']],practice:[['回想','先不看摘录，说说哪一句改变了整段的语气。','开放练习'],['提示','留意叙述从“走路”转向“时间”的位置。','线索'],['反馈方式','比较你与原文的联系，不替文学阅读规定一个标准感受。','评阅边界']]},
 {id:'thought',name:'随笔思考',en:'THINKING',title:'空出来的半小时',kind:'一段尚未想完的随笔',source:'随手写下 · 原创示例',excerpt:'总把忙碌当成充实，今天却最喜欢空出来的半小时。没有完成什么，也没有觉得白过。',thought:'我喜欢的究竟是空闲，还是不必立刻回应任何人的自由？这件事还想再写一写。',question:'“充实”和“忙碌”，对我分别意味着什么？',tags:['时间','自我','留白'],organize:[['保留原话','“没有完成什么，也没有觉得白过”保留在笔记里。','原话'],['核心疑问','我喜欢空闲本身，还是暂时不必回应的自由？','你的问题'],['延续思考','将“忙碌”“充实”“自由”归为可继续展开的线索。','整理草稿']],ask:[['追问','什么时候，“做得更多”反而没有让我觉得更充实？','自我观察'],['展开方式','先写一个具体的时刻，再比较当时的期待与实际感受。','写作提示'],['不替你定义','AI 可以提问，但不根据一段随笔替你下性格或心理结论。','边界']],practice:[['重逢','过几天再读：你现在还同意这段话吗？','回看问题'],['补记','找一个让你感到充实，却并不忙碌的瞬间。','具体例子'],['留下变化','把新的看法作为补记，保留最初那一版。','版本']]},
 {id:'daily',name:'生活记录',en:'LIVING',title:'早餐的十分钟',kind:'一个普通早晨的记录',source:'日常片段 · 原创示例',excerpt:'早餐时把手机留在房间。听见窗外的风，和面包烤好时轻轻的一声。原来十分钟也可以这么长。',thought:'想记住的不是一顿特别的早餐，而是终于注意到那些很小的声音。',question:'这个早晨，你最想留下哪个细节？',tags:['日常','感官','片刻'],organize:[['留下细节','风声、面包烤好的声音，以及没有把手机放在身边。','记录'],['一句标题','早餐的十分钟。标题可以接受、修改或不要。','标题草稿'],['保留温度','不把日常记录扩写成原话里没有发生过的故事。','原则']],ask:[['追问','如果只留一个感官细节，你会选哪个？','回到记忆'],['轻轻展开','声音、光线、气味，哪一项最能带你回到那个早晨？','写作线索'],['不作推断','一顿早餐不等于健康结论，也不需要被加工成人生道理。','边界']],practice:[['回看','看这张早餐小卡，试着想起那天的一种声音。','图像线索'],['补记','今天有没有一个也值得留下的十分钟？','日常邀请'],['随时结束','想起一个细节就够了；生活记录可以没有分数。','回看方式']]},
 {id:'art',name:'艺术观展',en:'SEEING',title:'两幅画之间',kind:'观展后的感受与疑问',source:'虚构展厅 · 原创观展随记',excerpt:'在一间没有其他观众的展厅里，停留最久的地方，是两幅画之间的空白。它让前一幅画慢慢退后，又让后一幅有了开始。',thought:'我在意的似乎是作品之间的节奏。先把这种感受记下来，展签和策展说明以后再补。',question:'空白怎样改变了你看一幅画的方式？',tags:['留白','观看','空间'],organize:[['观察','停留在两幅画之间，注意到空白带来的观看节奏。','现场感受'],['材料待补','作品名称、作者、展签和策展说明没有提供，留空。','待补材料'],['区分层次','“作品之间的节奏”属于观众解读，不冒充艺术家的意图。','个人解读']],ask:[['追问','是距离、光线，还是前后作品的差异，让你停下来？','观察角度'],['对照','若把两幅作品挨近摆放，你的观看顺序可能怎样变化？','假想讨论'],['核实','关于作者和作品背景的说法，需要查证出处再写入。','来源要求']],practice:[['看图回想','不看文字，说说你注意到的“画外之物”。','回看问题'],['对照原记','你第一次留下的是作品内容，还是观看时的感受？','原话对照'],['继续看','下次观展，也试着看看作品之间的距离。','观察线索']]},
 {id:'travel',name:'旅行见闻',en:'WANDERING',title:'港口没有下一站',kind:'没有赶路的一页旅行记录',source:'想象中的海边小城 · 原创示例',excerpt:'没有赶去下一个景点，坐在港口看船进出。后来最先想起的，是防波堤尽头的风，而不是走过多少地方。',thought:'路线可以存在地图里。想留在这里的，是那一刻为什么不想走。',question:'回想这次旅行，你先记起了什么？',tags:['远行','片刻','停留'],organize:[['留下场景','港口、船、防波堤与风，整理为可检索的场景线索。','原记录'],['个人感受','“不想走的那一刻”与行程信息分开保留。','感受'],['不补地点','原话没有具体地名，不凭空生成真实定位或路线。','不确定项']],ask:[['追问','如果只能带走一张画面，你会选择船，还是防波堤？','回忆线索'],['展开','当时做了什么，让你觉得可以暂时不用赶路？','具体时刻'],['事实与感受','地名和时间可以事后核对，感受不需要被改成旅游攻略。','记录方式']],practice:[['重温','先看港口小图，再用三个词回想当时的感受。','图像线索'],['小小联系','它与你平日喜欢的某种时刻，有相似之处吗？','联系问题'],['留下原貌','记不清的细节可以留白，不用为了完整而补写。','原则']]},
 {id:'idea',name:'实验想法',en:'EXPLORING',title:'叶子会朝向哪里？',kind:'一个还没有答案的观察想法',source:'植物观察构想 · 原创示例',excerpt:'如果同一种幼苗受到来自不同方向的光，叶片的朝向会不会不同？先记下这个问题，想想该怎样比较。',thought:'我需要把“想验证什么”和“已经看到了什么”分开。光照方向之外，还有哪些条件需要记录？',question:'要比较这个想法，哪些条件应该尽量一致？',tags:['观察','假设','变量'],organize:[['研究问题','不同方向的光照，与叶片朝向是否有关？','你的问题'],['待考虑条件','幼苗种类、初始状态、拍摄视角、时间和其他环境差异。','设计草稿'],['不作结论','尚未提供观察结果；想法不能被整理成已验证的规律。','待验证']],ask:[['追问','你希望记录的是叶片的角度，还是整体生长方向？','明确观察对象'],['检查设计','若相机位置每天变化，怎样区分真实变化与拍摄差异？','比较条件'],['保留未知','模型可以帮助列出遗漏，不能替代真实实验和条件核对。','边界']],practice:[['解释想法','用一句话说出问题，再列一项可能干扰比较的条件。','理解练习'],['提示','分别想想植物本身、光照和记录方式。','线索'],['核对','对照已确认的设计笔记，找出遗漏的条件；建议仍需人工判断。','反馈形式']]},
 {id:'record',name:'实验记录',en:'OBSERVING',title:'窗边幼苗，第三天',kind:'照片、过程与待核实的观察',source:'演示观察记录 · 示例数据 D03',excerpt:'在同一时刻拍照，尽量保持固定视角。今天叶片看起来略向窗侧倾斜；先保留原照片，暂时不判断原因。',thought:'记录观察与拍摄条件。角度没有测量，光照条件还要补，不把“看起来”写成精确数值。',question:'这条记录里，哪些是观察，哪些还需要测量？',tags:['记录','证据','待核实'],organize:[['已有观察','叶片看起来略向窗侧倾斜；保留原图和“看起来”的措辞。','观察原话'],['待补字段','拍摄时刻、固定视角说明、光照条件及样品标识。','待核对'],['不补读数','没有提供角度测量，不能从插图生成精确数值。','缺失项']],ask:[['追问','前一天的照片与今天，拍摄距离和方向一致吗？','比较依据'],['识图边界','未来识图仅给出观察草稿；看不清的仪器读数或细节应留空待核对。','规划能力'],['可追溯','修订说明和照片关联，保留原记录，不覆盖未经确认的内容。','记录原则']],practice:[['回查','从记录中找一条可见观察，再找一条尚未验证的解释。','证据练习'],['提示','“看起来略向窗侧”与“由于光照导致”属于不同层次。','区分层次'],['反馈方式','指出观察、测量与解释混在一起的位置，让你确认修改。','评阅草稿']]}
];

const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('allCases').innerHTML=leafCases.map((c,i)=>`<article class="case-card" id="${esc(c.id)}" style="animation-delay:${Math.min(i*60,300)}ms"><span class="chapter-label">0${i+1} / ${esc(c.name)}</span><h2>${esc(c.title)}</h2><svg class="scene" viewBox="0 0 480 320" role="img" aria-label="${esc(c.name)}原创插图"><use href="#scene-${esc(c.id)}"/></svg><small class="source">${esc(c.source)}</small><blockquote>${esc(c.excerpt)}</blockquote><p class="my-thought">${esc(c.thought)}</p><details><summary>展开整理候选</summary>${c.organize.map(([label,text,kind])=>`<div class="draft"><small>${esc(label)} · ${esc(kind)}</small><p>${esc(text)}</p></div>`).join('')}<p class="source">原始片段保留，候选需要自己核对后确认。</p></details><details><summary>下次可以问自己</summary><p>${esc(c.question)}</p><p class="source">回到原图或原文，先形成自己的回答。</p></details></article>`).join('');
